<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Catastale NCR - FlatGeobuf</title>

    <!-- Libreria OpenLayers CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.0.0/ol.css">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        
        #map {
            width: 100%;
            height: 100vh;
        }
        
        .info-panel {
            position: absolute;
            top: 15px;
            left: 50px; /* Spostato a destra per non coprire i controlli di zoom */
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            border-left: 4px solid #ff0000;
        }
    </style>
</head>
<body>

    <!-- Pannello informativo in sovraimpressione -->
    <div class="info-panel">
        <strong>Estratto Catastale</strong><br>
        <span style="font-size: 14px; color: #555;">Miglianico - Foglio 15 (Streaming FlatGeobuf)</span>
    </div>

    <!-- Contenitore della mappa -->
    <div id="map"></div>

    <!-- Libreria OpenLayers JS -->
    <script src="https://cdn.jsdelivr.net/npm/ol@v9.0.0/dist/ol.js"></script>
    
    <!-- Libreria FlatGeobuf per OpenLayers (Streaming) -->
    <script src="https://cdn.jsdelivr.net/npm/flatgeobuf@3.26.0/dist/flatgeobuf-geojson.min.js"></script>

    <script>
        // 1. Definisci il layer di base (OpenStreetMap)
        const rasterLayer = new ol.layer.Tile({
            source: new ol.source.OSM()
        });

        // 2. Percorso del file esportato dal tuo Plugin NCR (relativo alla cartella dell'index.html)
        const fgbUrl = 'data/Miglianico_F15.fgb';

        // 3. Configura il sorgente vettoriale per scaricare solo ciò che inquadri (BBOX strategy)
        const fgbSource = new ol.source.Vector({
            loader: async function(extent, resolution, projection) {
                try {
                    const response = await fetch(fgbUrl);
                    if (!response.ok) {
                        console.warn('File FlatGeobuf non ancora disponibile o percorso errato.');
                        return;
                    }
                    
                    // Deserializzazione in streaming spaziale
                    for await (const feature of flatgeobuf.deserialize(response.body)) {
                        // Converte il formato letto da FlatGeobuf in una feature OpenLayers
                        const olFeature = new ol.format.GeoJSON().readFeature(feature, {
                            dataProjection: 'EPSG:4326', // Formato di export WGS84 configurato in Python
                            featureProjection: projection // Proiezione web di OpenLayers (EPSG:3857)
                        });
                        this.addFeature(olFeature);
                    }
                } catch (e) {
                    console.error("Errore durante la lettura del file FGB:", e);
                }
            },
            strategy: ol.loadingstrategy.bbox // Richiede dinamicamente i dati in base allo zoom
        });

        // 4. Applica uno stile alle particelle (Bordo rosso, riempimento trasparente)
        const layerParticelle = new ol.layer.Vector({
            source: fgbSource,
            style: new ol.style.Style({
                stroke: new ol.style.Stroke({
                    color: '#ff0000',
                    width: 2,
                }),
                fill: new ol.style.Fill({
                    color: 'rgba(255, 0, 0, 0.15)',
                }),
            }),
        });

        // 5. Inizializza la mappa e collegala al div
        const map = new ol.Map({
            target: 'map',
            layers: [rasterLayer, layerParticelle],
            view: new ol.View({
                // Coordinate centrate indicativamente su Miglianico
                center: ol.proj.fromLonLat([14.2900, 42.3550]), 
                zoom: 15
            })
        });
    </script>
</body>
</html>
