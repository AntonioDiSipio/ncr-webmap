<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa Catastale NCR - FlatGeobuf</title>

    <!-- Libreria OpenLayers CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.0.0/ol.css">
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }
        
        #map {
            width: 100%;
            height: 100vh;
        }
        
        .info-panel {
            position: absolute;
            top: 15px;
            left: 50px;
            background: rgba(255, 255, 255, 0.9);
            padding: 10px 15px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 1000;
            border-left: 4px solid #ff0000;
        }
    </style>
</head>
<body>

    <div class="info-panel">
        <strong>Estratto Catastale</strong><br>
        <span style="font-size: 14px; color: #555;">Miglianico - Foglio 15 (Streaming FlatGeobuf)</span>
    </div>

    <div id="map"></div>

    <script src="https://cdn.jsdelivr.net/npm/ol@v9.0.0/dist/ol.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatgeobuf@3.26.0/dist/flatgeobuf-geojson.min.js"></script>

    <script>
        const rasterLayer = new ol.layer.Tile({
            source: new ol.source.OSM()
        });

        // NOTA: Se hai caricato il file FGB nella stessa cartella dell'index.html
        // e NON dentro una cartella "data", cambia questa stringa in 'Miglianico_F15.fgb'
        const fgbUrl = 'data/Miglianico_F15.fgb';

        const fgbSource = new ol.source.Vector({
            loader: async function(extent, resolution, projection) {
                // 1. Convertiamo il riquadro dello schermo da EPSG:3857 (OpenLayers) a EPSG:4326 (Dati catastali)
                const extent4326 = ol.proj.transformExtent(extent, projection, 'EPSG:4326');
                const rect = {
                    minX: extent4326[0],
                    minY: extent4326[1],
                    maxX: extent4326[2],
                    maxY: extent4326[3]
                };

                try {
                    // 2. Interroghiamo SOLO i byte del file che ricadono nel riquadro visibile
                    const iterator = flatgeobuf.deserialize(fgbUrl, rect);
                    
                    for await (const feature of iterator) {
                        // Creiamo un ID fittizio per evitare che la stessa particella venga clonata 
                        // se fai "avanti e indietro" con la mappa
                        const featId = feature.id || (feature.properties && feature.properties.particella) || JSON.stringify(feature.geometry.coordinates[0][0]);
                        
                        if (this.getFeatureById(featId) !== null) continue;
                        
                        const olFeature = new ol.format.GeoJSON().readFeature(feature, {
                            dataProjection: 'EPSG:4326',
                            featureProjection: projection
                        });
                        
                        olFeature.setId(featId);
                        this.addFeature(olFeature);
                    }
                } catch (e) {
                    console.error("Errore di rete o file non ancora disponibile su GitHub Pages:", e);
                }
            },
            strategy: ol.loadingstrategy.bbox
        });

        const layerParticelle = new ol.layer.Vector({
            source: fgbSource,
            style: new ol.style.Style({
                stroke: new ol.style.Stroke({
                    color: '#ff0000',
                    width: 2,
                }),
                fill: new ol.style.Fill({
                    color: 'rgba(255, 0, 0, 0.15)',
                }),
            }),
        });

        const map = new ol.Map({
            target: 'map',
            layers: [rasterLayer, layerParticelle],
            view: new ol.View({
                center: ol.proj.fromLonLat([14.2900, 42.3550]), 
                zoom: 15
            })
        });
    </script>
</body>
</html>
